name: Actualizar EPG TVN 14

on:
  schedule:
    - cron: '0 6 * * *' # Todos los días a las 06:00 UTC (00:00 hora de Costa Rica)
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite al bot hacer commit y push

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium para Playwright
        run: playwright install --with-deps chromium

      - name: Ejecutar script de EPG
        run: python main.py

      - name: Commit y Push de los cambios en el EPG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg_tvn14_diario.xml
          if ! git diff --staged --quiet; then
            git commit -m "Actualización automática EPG diario TVN 14 [skip ci]"
            git push origin HEAD
          else
            echo "No hay cambios en el archivo EPG."
          fi
