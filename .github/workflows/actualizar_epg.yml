name: Actualizar EPG TVN14

on:
  schedule:
    - cron: '0 6 * * *' # Se ejecuta todos los días a las 06:00 UTC
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite al bot hacer commit y push

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de EPG
        run: python main.py

      - name: Commit y Push de los cambios en el EPG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg_tvn14_semanal.xml epg_tvn14_semanal.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática EPG TVN14 [skip ci]" && git push origin HEAD)
